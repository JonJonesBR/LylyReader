name: Repository hygiene

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  secret-pattern-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Scan for common leaked secret patterns
        shell: bash
        run: |
          set -euo pipefail

          pattern='(AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|github_pat_[0-9A-Za-z_]{20,}|ghp_[0-9A-Za-z]{20,}|sk-[A-Za-z0-9_-]{20,}|-----BEGIN (RSA |EC |OPENSSH |DSA |)PRIVATE KEY-----)'

          if grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            --exclude-dir=build \
            --exclude='*.lock' \
            "$pattern" .; then
            echo "Potential secret pattern found. Remove it or replace it with a placeholder."
            exit 1
          fi
