name: Repository hygiene

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  secret-pattern-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Scan for common leaked secret patterns
        shell: bash
        run: |
          set -euo pipefail

          pattern='(AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|github_pat_[0-9A-Za-z_]{20,}|ghp_[0-9A-Za-z]{20,}|sk-[A-Za-z0-9_-]{20,}|sk_[A-Za-z0-9]{32,}|hf_[A-Za-z0-9]{30,}|xi-api-key[^A-Za-z0-9]{0,6}[=:][^A-Za-z0-9]{0,3}[A-Za-z0-9_-]{20,}|-----BEGIN (RSA |EC |OPENSSH |DSA |)PRIVATE KEY-----)'

          if grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            --exclude-dir=build \
            --exclude='*.lock' \
            "$pattern" .; then
            echo "Potential secret pattern found. Remove it or replace it with a placeholder."
            exit 1
          fi

      - name: Block signing keys and signing configs
        # Chave de assinatura e senhas ficam só nos segredos do GitHub, nunca no repositório.
        shell: bash
        run: |
          set -euo pipefail
          proibidos="$(git ls-files | grep -iE '(\.jks|\.keystore|\.p12|\.pfx)$|(^|/)release\.properties$|(^|/)debug-signing\.properties$' || true)"
          if [ -n "$proibidos" ]; then
            echo "Signing key or signing config committed:"
            echo "$proibidos"
            exit 1
          fi
