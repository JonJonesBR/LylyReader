name: Checks

# Conferência leve a cada mudança de código no main (e em pull requests): compila, roda os testes
# unitários e, por enquanto só avisando, o detekt e o lint. Não gera APK, não publica nada e não usa
# segredos. Gerar APK continua manual (android-ci.yml) e versões continuam no release.yml.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "rust/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "detekt-baseline.xml"
      - ".github/workflows/checks.yml"
  pull_request:
    paths:
      - "app/**"
      - "rust/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "detekt-baseline.xml"
      - ".github/workflows/checks.yml"

# Vários envios seguidos: só o mais novo é conferido.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  ORT_SUPERTONIC_VERSION: "1.26.0"
  # SHA-256 do onnxruntime-android-1.26.0.aar do Maven Central. Trocar junto com android-ci.yml e release.yml.
  ORT_SUPERTONIC_SHA256: "09c0780ae8d734ef2774bdf498b624729a855e6f9a8e488a0e7398a4e7396032"
  SHERPA_ONNX_VERSION: "1.13.7"
  SHERPA_ONNX_SHA256: "220d7cb25ac6e57ec34082bc2551ebd7ec7d4d96cbfea520839e208f92347837"

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # Default do action é "tools platform-tools" — o pacote legado "tools" foi removido
          # do repositório do Android SDK (2026-09-15: sdkmanager passou a falhar com "Failed
          # to find package 'tools'"). Só platform-tools é necessário aqui; o resto (platform +
          # build-tools) já é instalado explicitamente no passo "Install Android platform".
          packages: "platform-tools"

      - name: Set up Python for Chaquopy
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Run Python tests
        # Os mesmos testes que o release.yml roda antes de gerar o APK (e as mesmas versões dos pacotes): sem eles aqui,
        # uma regressão na conversão (Python) só aparecia na hora de publicar uma versão.
        run: |
          python -m pip install --quiet pytest "edge-tts==7.3.1" aiohttp "mutagen==1.48.1" Pillow "pypdf==6.21.2" \
            "python-docx==1.2.0" "ebooklib==0.20" "beautifulsoup4==4.15.0" "httpx==0.28.1" numpy "olefile==0.47" "mobi==0.4.1"
          python -m pytest app/src/test/python -q

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Fetch libonnxruntime_supertonic.so (ONNX Runtime para o Supertonic)
        run: |
          set -e
          mkdir -p .ortdl
          curl -fsSL -o .ortdl/ort.aar \
            "https://repo1.maven.org/maven2/com/microsoft/onnxruntime/onnxruntime-android/${ORT_SUPERTONIC_VERSION}/onnxruntime-android-${ORT_SUPERTONIC_VERSION}.aar"
          echo "${ORT_SUPERTONIC_SHA256}  .ortdl/ort.aar" | sha256sum -c - \
            || { echo "::error::onnxruntime-android baixado não confere com o SHA-256 esperado."; exit 1; }
          (cd .ortdl && unzip -q ort.aar -d x)
          for abi in arm64-v8a x86_64; do
            mkdir -p "app/src/main/jniLibs/$abi"
            cp ".ortdl/x/jni/$abi/libonnxruntime.so" "app/src/main/jniLibs/$abi/libonnxruntime_supertonic.so"
          done
          echo "libonnxruntime_supertonic.so copiada (arm64-v8a, x86_64)."

      - name: Fetch sherpa-onnx AAR (motor Kokoro no aparelho)
        # O AAR não fica mais no Git: baixa da release oficial e só segue se o SHA-256 bater.
        run: |
          set -e
          mkdir -p app/libs
          curl -fsSL -o "app/libs/sherpa-onnx-static-link-onnxruntime-${SHERPA_ONNX_VERSION}.aar" \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${SHERPA_ONNX_VERSION}/sherpa-onnx-static-link-onnxruntime-${SHERPA_ONNX_VERSION}.aar"
          echo "${SHERPA_ONNX_SHA256}  app/libs/sherpa-onnx-static-link-onnxruntime-${SHERPA_ONNX_VERSION}.aar" | sha256sum -c - \
            || { echo "::error::sherpa-onnx baixado não confere com o SHA-256 esperado."; exit 1; }

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache pip (Chaquopy)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Run unit tests (compila o app)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Run detekt (só avisa)
        # Achados antigos estão no detekt-baseline.xml. Tornar bloqueante depois de alguns runs verdes.
        continue-on-error: true
        run: ./gradlew :app:detekt --stacktrace

      - name: Run lint (só avisa)
        continue-on-error: true
        run: ./gradlew :app:lintDebug --stacktrace
