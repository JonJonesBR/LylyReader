name: Android CI

on:
  # Sem APK automático (decisão de 2026-10-08): a conferência a cada push é o checks.yml (testes, sem APK). Para gerar o APK de depuração, rode manualmente.
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  ORT_SUPERTONIC_VERSION: "1.26.0"
  # SHA-256 do onnxruntime-android-1.26.0.aar do Maven Central (o .sha1 publicado lá confere). Trocar junto com a versão.
  ORT_SUPERTONIC_SHA256: "09c0780ae8d734ef2774bdf498b624729a855e6f9a8e488a0e7398a4e7396032"
  # Versão e SHA-256 do AAR do sherpa-onnx (release oficial k2-fsa). Trocar junto com app/build.gradle.kts.
  SHERPA_ONNX_VERSION: "1.13.7"
  SHERPA_ONNX_SHA256: "220d7cb25ac6e57ec34082bc2551ebd7ec7d4d96cbfea520839e208f92347837"

jobs:
  build:
    # Push de tag já é coberto pelo release.yml (que builda e testa o mesmo commit).
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # Default do action é "tools platform-tools" — o pacote legado "tools" foi removido
          # do repositório do Android SDK (2026-09-15: sdkmanager passou a falhar com "Failed
          # to find package 'tools'"). Só platform-tools é necessário aqui; o resto (platform +
          # build-tools) já é instalado explicitamente no passo "Install Android platform".
          packages: "platform-tools"

      - name: Set up Python for Chaquopy
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Fetch libonnxruntime_supertonic.so (ONNX Runtime para o Supertonic)
        run: |
          set -e
          mkdir -p .ortdl
          curl -fsSL -o .ortdl/ort.aar \
            "https://repo1.maven.org/maven2/com/microsoft/onnxruntime/onnxruntime-android/${ORT_SUPERTONIC_VERSION}/onnxruntime-android-${ORT_SUPERTONIC_VERSION}.aar"
          echo "${ORT_SUPERTONIC_SHA256}  .ortdl/ort.aar" | sha256sum -c - \
            || { echo "::error::onnxruntime-android baixado não confere com o SHA-256 esperado."; exit 1; }
          (cd .ortdl && unzip -q ort.aar -d x)
          for abi in arm64-v8a x86_64; do
            mkdir -p "app/src/main/jniLibs/$abi"
            cp ".ortdl/x/jni/$abi/libonnxruntime.so" "app/src/main/jniLibs/$abi/libonnxruntime_supertonic.so"
          done
          echo "libonnxruntime_supertonic.so copiada (arm64-v8a, x86_64)."

      - name: Fetch sherpa-onnx AAR (motor Kokoro no aparelho)
        # O AAR não fica mais no Git: baixa da release oficial e só segue se o SHA-256 bater.
        run: |
          set -e
          mkdir -p app/libs
          curl -fsSL -o "app/libs/sherpa-onnx-static-link-onnxruntime-${SHERPA_ONNX_VERSION}.aar" \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${SHERPA_ONNX_VERSION}/sherpa-onnx-static-link-onnxruntime-${SHERPA_ONNX_VERSION}.aar"
          echo "${SHERPA_ONNX_SHA256}  app/libs/sherpa-onnx-static-link-onnxruntime-${SHERPA_ONNX_VERSION}.aar" | sha256sum -c - \
            || { echo "::error::sherpa-onnx baixado não confere com o SHA-256 esperado."; exit 1; }

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache pip (Chaquopy)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        # continue-on-error: a cota de armazenamento de Artifacts (500MB) já estourou antes e
        # volta a estourar com uso normal (recálculo leva 6-12h) — quando isso acontece, o
        # BUILD (o que importa: o código compila) já passou, só o upload de conveniência falha.
        # Sem isso, o check fica "failing" por um problema de infraestrutura sem relação com o
        # código, mascarando o sinal real (ver "Build debug APK" acima).
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: lylyreader-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 3

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Run detekt (análise estática)
        # Ainda não bloqueante: os achados atuais já estão no detekt-baseline.xml, mas o
        # resultado ainda não foi confirmado no CI. Torne bloqueante (remova continue-on-error)
        # só depois de um run verde.
        continue-on-error: true
        run: ./gradlew :app:detekt --stacktrace

  release-r8:
    # Job manual de conferência: assembleRelease (R8 + shrinkResources) sem segredos. Sem
    # release.properties o APK sai sem assinatura — o objetivo é só pegar regressões de keep
    # (ver comentários em app/proguard-rules.pro), não gerar APK de release.
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: "platform-tools"

      - name: Set up Python for Chaquopy
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Fetch libonnxruntime_supertonic.so (ONNX Runtime para o Supertonic)
        run: |
          set -e
          mkdir -p .ortdl
          curl -fsSL -o .ortdl/ort.aar \
            "https://repo1.maven.org/maven2/com/microsoft/onnxruntime/onnxruntime-android/${ORT_SUPERTONIC_VERSION}/onnxruntime-android-${ORT_SUPERTONIC_VERSION}.aar"
          echo "${ORT_SUPERTONIC_SHA256}  .ortdl/ort.aar" | sha256sum -c - \
            || { echo "::error::onnxruntime-android baixado não confere com o SHA-256 esperado."; exit 1; }
          (cd .ortdl && unzip -q ort.aar -d x)
          for abi in arm64-v8a x86_64; do
            mkdir -p "app/src/main/jniLibs/$abi"
            cp ".ortdl/x/jni/$abi/libonnxruntime.so" "app/src/main/jniLibs/$abi/libonnxruntime_supertonic.so"
          done
          echo "libonnxruntime_supertonic.so copiada (arm64-v8a, x86_64)."

      - name: Fetch sherpa-onnx AAR (motor Kokoro no aparelho)
        # O AAR não fica mais no Git: baixa da release oficial e só segue se o SHA-256 bater.
        run: |
          set -e
          mkdir -p app/libs
          curl -fsSL -o "app/libs/sherpa-onnx-static-link-onnxruntime-${SHERPA_ONNX_VERSION}.aar" \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${SHERPA_ONNX_VERSION}/sherpa-onnx-static-link-onnxruntime-${SHERPA_ONNX_VERSION}.aar"
          echo "${SHERPA_ONNX_SHA256}  app/libs/sherpa-onnx-static-link-onnxruntime-${SHERPA_ONNX_VERSION}.aar" | sha256sum -c - \
            || { echo "::error::sherpa-onnx baixado não confere com o SHA-256 esperado."; exit 1; }

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache pip (Chaquopy)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Build release APK (R8 + shrinkResources, sem assinatura)
        run: ./gradlew :app:assembleRelease --stacktrace
