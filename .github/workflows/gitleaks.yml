name: Segredos (gitleaks)

# Procura chaves, tokens e senhas no código e em todo o histórico.
# Roda no push em main, em pull requests e sob demanda. Só lê; não usa secrets.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # histórico completo
          persist-credentials: false
      # Binário fixado por versão e conferido pelo sha256 (sem action de terceiros).
      - name: Instalar gitleaks
        run: |
          V=8.30.1
          curl -fsSL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
      - name: Procurar segredos no histórico
        run: /tmp/gitleaks git --redact --verbose --exit-code 1 --config .github/gitleaks.toml .
