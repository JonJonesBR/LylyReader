name: UI Tests

# Testes de interface (rb-46) no emulador Android: abrem a ReaderActivity real, tiram capturas e medidas. Este workflow
# barra: entra na regra do rb-32 (a main só recebe código que passou no Checks e no UI Tests do PR). Tem nova tentativa
# automática só para falha de infraestrutura do emulador (não subiu, pacote corrompido, aparelho caiu no meio): um teste
# vermelho (assert) não é repetido, para não mascarar teste instável. Sem segredos e sem publicar nada; as capturas
# ficam no artefato ui-capturas por 3 dias.
on:
  pull_request:
    paths:
      - "app/**"
      - "rust/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "detekt-baseline.xml"
      - ".github/workflows/ui-tests.yml"
      - "scripts/ci/**"
  workflow_dispatch:

# Vários envios seguidos: só o mais novo é testado.
concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  ORT_SUPERTONIC_VERSION: "1.26.0"
  # SHA-256 do onnxruntime-android-1.26.0.aar do Maven Central. Trocar junto com android-ci.yml e release.yml.
  ORT_SUPERTONIC_SHA256: "09c0780ae8d734ef2774bdf498b624729a855e6f9a8e488a0e7398a4e7396032"
  SHERPA_ONNX_VERSION: "1.13.7"
  SHERPA_ONNX_SHA256: "220d7cb25ac6e57ec34082bc2551ebd7ec7d4d96cbfea520839e208f92347837"

jobs:
  emulador:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # Só platform-tools aqui; platform, build-tools e o emulador entram nos passos seguintes.
          packages: "platform-tools"

      - name: Set up Python for Chaquopy
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Fetch libonnxruntime_supertonic.so (ONNX Runtime para o Supertonic)
        run: |
          set -e
          mkdir -p .ortdl
          curl -fsSL -o .ortdl/ort.aar \
            "https://repo1.maven.org/maven2/com/microsoft/onnxruntime/onnxruntime-android/${ORT_SUPERTONIC_VERSION}/onnxruntime-android-${ORT_SUPERTONIC_VERSION}.aar"
          echo "${ORT_SUPERTONIC_SHA256}  .ortdl/ort.aar" | sha256sum -c - \
            || { echo "::error::onnxruntime-android baixado não confere com o SHA-256 esperado."; exit 1; }
          (cd .ortdl && unzip -q ort.aar -d x)
          for abi in arm64-v8a x86_64; do
            mkdir -p "app/src/main/jniLibs/$abi"
            cp ".ortdl/x/jni/$abi/libonnxruntime.so" "app/src/main/jniLibs/$abi/libonnxruntime_supertonic.so"
          done
          echo "libonnxruntime_supertonic.so copiada (arm64-v8a, x86_64)."

      - name: Fetch sherpa-onnx AAR (motor Kokoro no aparelho)
        # O AAR não fica mais no Git: baixa da release oficial e só segue se o SHA-256 bater.
        run: |
          set -e
          mkdir -p app/libs
          curl -fsSL -o "app/libs/sherpa-onnx-static-link-onnxruntime-${SHERPA_ONNX_VERSION}.aar" \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${SHERPA_ONNX_VERSION}/sherpa-onnx-static-link-onnxruntime-${SHERPA_ONNX_VERSION}.aar"
          echo "${SHERPA_ONNX_SHA256}  app/libs/sherpa-onnx-static-link-onnxruntime-${SHERPA_ONNX_VERSION}.aar" | sha256sum -c - \
            || { echo "::error::sherpa-onnx baixado não confere com o SHA-256 esperado."; exit 1; }

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache pip (Chaquopy)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Enable KVM (aceleração do emulador)
        # Regra udev da própria ação android-emulator-runner (README): sem KVM o emulador é lento demais.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build do APK de teste e do APK dos testes de interface
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Testes de interface no emulador
        id: emulador
        # continue-on-error: a falha de infraestrutura é decidida no passo Resultado (com a nova tentativa abaixo).
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/ci/testes-de-interface.sh

      - name: Limpa o 1º run do emulador (falha de infraestrutura)
        if: steps.emulador.outcome == 'failure'
        # Apaga também os relatórios do Gradle do 1º run, para o artefato não misturar resultados velhos com os da 2ª tentativa.
        run: |
          rm -rf ui-resultado.txt logcat-ui.txt ui-adb ui-gradle.txt
          rm -rf app/build/outputs/androidTest-results app/build/reports/androidTests app/build/outputs/connected_android_test_additional_output
          echo "::warning::O emulador falhou (infraestrutura, não um teste): nova tentativa."

      - name: Testes de interface no emulador (nova tentativa)
        # Igual ao passo acima. Só roda se o 1º falhou como passo (emulador que não subiu ou falha de infraestrutura no script).
        id: emulador2
        if: steps.emulador.outcome == 'failure'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/ci/testes-de-interface.sh

      - name: Upload capturas, relatórios e logcat
        # Roda mesmo com o teste falho: é justamente nesse caso que as capturas e o logcat servem.
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ui-capturas
          # 3 dias: as capturas são de diagnóstico, não precisam ficar muito tempo na cota de Artifacts.
          retention-days: 3
          if-no-files-found: warn
          path: |
            app/build/outputs/connected_android_test_additional_output/
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/
            ui-adb/
            logcat-ui.txt
            ui-gradle.txt

      - name: Resultado
        # Deixa o run vermelho quando (a) um teste falhou (o script grava ui-resultado.txt) ou (b) o emulador falhou nas
        # duas tentativas. Se a 1ª passou, a 2ª fica "skipped", e isso é sucesso.
        if: always()
        env:
          OUTCOME_EMULADOR_1: ${{ steps.emulador.outcome }}
          OUTCOME_EMULADOR_2: ${{ steps.emulador2.outcome }}
        run: |
          if [ -f ui-resultado.txt ]; then
            echo "::error::Testes de interface falharam (ver ui-resultado.txt e o logcat no artefato ui-capturas)."
            exit 1
          fi
          if [ "$OUTCOME_EMULADOR_1" = "failure" ] && [ "$OUTCOME_EMULADOR_2" = "failure" ]; then
            echo "::error::O emulador falhou nas duas tentativas (infraestrutura, não um teste)."
            exit 1
          fi
          echo "Testes de interface: sem falha (emulador: 1ª=$OUTCOME_EMULADOR_1, 2ª=$OUTCOME_EMULADOR_2)."
