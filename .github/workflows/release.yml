name: Release Build

# Dispara automaticamente ao publicar uma tag "v*" (ex.: v1.7.0) e também pode ser rodado
# manualmente. Builda o APK de release e o anexa à Release do GitHub da tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (ex.: 1.7.0). Se vazio em tag, usa a tag sem o 'v'."
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Deve casar com chaquopy.defaultConfig.version em app/build.gradle.kts
  CHAQUOPY_PYTHON: "3.11"
  ORT_SUPERTONIC_VERSION: "1.26.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # necessário para git rev-list --count (versionCode)

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Mesmo fix do android-ci.yml (2026-09-15): o pacote legado "tools" (default do
          # action) foi removido do repositório do Android SDK — sdkmanager passa a falhar com
          # "Failed to find package 'tools'". Só platform-tools é necessário aqui; o resto
          # (platform + build-tools) já é instalado explicitamente no passo seguinte.
          packages: "platform-tools"

      - name: Set up Python for Chaquopy
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.CHAQUOPY_PYTHON }}

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Derive version
        run: |
          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            VN="${{ github.event.inputs.version_name }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VN="${GITHUB_REF_NAME#v}"
          else
            VN="dev-${GITHUB_SHA::7}"
          fi
          echo "VERSION_NAME=$VN" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          echo "Building version $VN (code $(git rev-list --count HEAD))"

      - name: Fetch libonnxruntime_supertonic.so (ONNX Runtime para o Supertonic)
        run: |
          set -e
          mkdir -p .ortdl
          curl -fsSL -o .ortdl/ort.aar \
            "https://repo1.maven.org/maven2/com/microsoft/onnxruntime/onnxruntime-android/${ORT_SUPERTONIC_VERSION}/onnxruntime-android-${ORT_SUPERTONIC_VERSION}.aar"
          (cd .ortdl && unzip -q ort.aar -d x)
          for abi in arm64-v8a x86_64; do
            mkdir -p "app/src/main/jniLibs/$abi"
            cp ".ortdl/x/jni/$abi/libonnxruntime.so" "app/src/main/jniLibs/$abi/libonnxruntime_supertonic.so"
          done
          echo "libonnxruntime_supertonic.so copiada (arm64-v8a, x86_64)."

      - name: Configure release signing (opcional, via secrets)
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PW: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.jks
            {
              echo "storeFile=release.jks"
              echo "storePassword=$KS_PW"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PW"
            } > release.properties
            echo "Assinatura configurada (APK será assinado)."
          else
            echo "Sem secrets de assinatura — o APK de release sairá NÃO assinado."
          fi

      - name: Run unit tests (gate)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build release APK
        run: >
          ./gradlew :app:assembleRelease --stacktrace
          -PversionNameOverride="${VERSION_NAME}"
          -PversionCodeOverride="${VERSION_CODE}"

      - name: Prepare APK asset
        run: |
          set -e
          APK="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          OUT="LylyReader-v${VERSION_NAME}.apk"
          cp "$APK" "$OUT"
          echo "APK_ASSET=$OUT" >> "$GITHUB_ENV"
          echo "Asset: $OUT (origem: $APK)"

      - name: Upload APK artifact
        # Retenção curta de propósito: em push de tag, o próximo passo já anexa o mesmo APK
        # à GitHub Release (permanente, fora da cota de armazenamento de Actions) — este
        # artefato aqui só serve pra runs manuais (workflow_dispatch sem tag), onde é o único
        # jeito de baixar o APK. Sem isso, cada release deixava ~97MB parados sem expirar,
        # estourando a cota de 500MB de artefatos em poucas releases.
        # continue-on-error: essencial — sem isso, a cota de artefatos (que já bloqueou builds
        # antes, ver histórico) derruba este passo E impede o próximo (Attach APK to GitHub
        # Release) de rodar, porque um passo falho para o job por padrão. O artefato aqui é só
        # conveniência pra workflow_dispatch manual; a Release em si (o que importa de verdade
        # em push de tag) nunca pode depender dele ter sucesso.
        uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: lylyreader-${{ env.VERSION_NAME }}-apk
          path: ${{ env.APK_ASSET }}
          retention-days: 3

      - name: Attach APK to GitHub Release
        if: ${{ github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: LylyReader ${{ env.VERSION_NAME }}
          files: ${{ env.APK_ASSET }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          # Tags com hífen (ex.: v1.6.1-beta.2) são pré-releases; v1.6.1 é release final.
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Delete older releases (mantém só a mais recente, "uma release por vez")
        # Roda só depois da nova release já estar publicada com sucesso (passo acima) — limpeza,
        # nunca crítico ao processo de release em si. cleanup-tag NUNCA usado: as tags de versões
        # antigas são mantidas pra sempre, só a Release (card + assets anexados) é removida.
        if: ${{ github.ref_type == 'tag' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for tag in $(gh release list --limit 50 --json tagName --jq '.[].tagName'); do
            if [ "$tag" != "${{ github.ref_name }}" ]; then
              echo "Apagando release antiga: $tag (tag mantida)"
              gh release delete "$tag" --yes --cleanup-tag=false
            fi
          done
