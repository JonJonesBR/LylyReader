name: Release Build

# Só roda quando disparado à mão (Actions › Release Build › Run workflow); commits e pushes não geram APK.
# Testa, builda o APK de DEPURAÇÃO (debug, sem assinatura de release), cria a tag v<versão> no commit
# disparado, publica a Release do GitHub com o APK (LylyReader-v<versão>-debug.apk) e mantém só as 3 Releases
# mais recentes (as tags antigas ficam, como histórico). Antes do APK, também compila o build de produção (R8)
# como verificação e roda os testes Python (por enquanto só informativos).
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Versão (ex.: 1.8.47). Vazio = a seguinte à última tag v* (1.8.46 → 1.8.47)."
        required: false
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Deve casar com chaquopy.defaultConfig.version em app/build.gradle.kts
  CHAQUOPY_PYTHON: "3.11"
  ORT_SUPERTONIC_VERSION: "1.26.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # necessário para git rev-list --count (versionCode)

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Mesmo fix do android-ci.yml (2026-09-15): o pacote legado "tools" (default do
          # action) foi removido do repositório do Android SDK — sdkmanager passa a falhar com
          # "Failed to find package 'tools'". Só platform-tools é necessário aqui; o resto
          # (platform + build-tools) já é instalado explicitamente no passo seguinte.
          packages: "platform-tools"

      - name: Set up Python for Chaquopy
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.CHAQUOPY_PYTHON }}

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Derive version
        env:
          VERSION_INPUT: ${{ github.event.inputs.version_name }}
        run: |
          set -e
          ULTIMA="$(git tag -l 'v*' --sort=-v:refname | head -1)"
          if [ -n "$VERSION_INPUT" ]; then
            VN="${VERSION_INPUT#v}"
          elif [ -n "$ULTIMA" ]; then
            # Próxima versão: soma 1 ao último número da última tag (v1.8.46 → 1.8.47; v1.9.0-beta.1 → 1.9.0-beta.2).
            BASE="${ULTIMA#v}"
            NUM="$(echo "$BASE" | grep -oE '[0-9]+$')"
            VN="${BASE%$NUM}$((NUM + 1))"
          else
            VN="1.0.0"
          fi
          if git rev-parse -q --verify "refs/tags/v$VN" >/dev/null; then
            echo "::error::A tag v$VN já existe. Informe outra versão em version_name."
            exit 1
          fi
          echo "VERSION_NAME=$VN" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          echo "Building version $VN (code $(git rev-list --count HEAD)); última tag: ${ULTIMA:-nenhuma}"

      - name: Fetch libonnxruntime_supertonic.so (ONNX Runtime para o Supertonic)
        run: |
          set -e
          mkdir -p .ortdl
          curl -fsSL -o .ortdl/ort.aar \
            "https://repo1.maven.org/maven2/com/microsoft/onnxruntime/onnxruntime-android/${ORT_SUPERTONIC_VERSION}/onnxruntime-android-${ORT_SUPERTONIC_VERSION}.aar"
          (cd .ortdl && unzip -q ort.aar -d x)
          for abi in arm64-v8a x86_64; do
            mkdir -p "app/src/main/jniLibs/$abi"
            cp ".ortdl/x/jni/$abi/libonnxruntime.so" "app/src/main/jniLibs/$abi/libonnxruntime_supertonic.so"
          done
          echo "libonnxruntime_supertonic.so copiada (arm64-v8a, x86_64)."

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache pip (Chaquopy)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Run unit tests (gate)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Python tests (informativo)
        # Cobrem a geração do audiobook (app/src/main/python). Ainda não bloqueiam a release: passam a bloquear
        # depois de alguns runs verdes. Versões dos pacotes puros iguais às de app/build.gradle.kts.
        continue-on-error: true
        run: |
          python -m pip install --quiet pytest "edge-tts==7.3.1" aiohttp "mutagen==1.48.1" Pillow "pypdf==6.21.2" \
            "python-docx==1.2.0" "ebooklib==0.20" "beautifulsoup4==4.15.0" "httpx==0.28.1" numpy "olefile==0.47" "mobi==0.4.1"
          python -m pytest app/src/test/python -q

      - name: Build release APK (R8, verificação)
        # Problemas de R8/ProGuard (JNI, Chaquopy, reflexão) só aparecem no build de produção. O APK publicado
        # continua sendo o debug; este passo só garante que o release compila.
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Prepare fixed debug signing key
        # Chave fixa do APK debug, guardada só como segredo do repositório (nunca no Git): mantém a
        # mesma assinatura em toda versão, para instalar a nova por cima da antiga. Sem os segredos
        # (ex.: fork), o build segue com a chave debug padrão.
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
        run: |
          set -e
          if [ -z "$DEBUG_KEYSTORE_B64" ] || [ -z "$DEBUG_KEYSTORE_PASSWORD" ]; then
            echo "Segredos da chave debug ausentes; usando a chave debug padrão."
            exit 0
          fi
          KS="$RUNNER_TEMP/lylyreader-debug.p12"
          echo "$DEBUG_KEYSTORE_B64" | base64 -d > "$KS"
          {
            echo "storeFile=$KS"
            echo "storePassword=$DEBUG_KEYSTORE_PASSWORD"
            echo "keyAlias=lylyreader-debug"
            echo "keyPassword=$DEBUG_KEYSTORE_PASSWORD"
          } > "$RUNNER_TEMP/debug-signing.properties"
          echo "LYLY_DEBUG_SIGNING_PROPS=$RUNNER_TEMP/debug-signing.properties" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: >
          ./gradlew :app:assembleDebug --stacktrace
          -PversionNameOverride="${VERSION_NAME}"
          -PversionCodeOverride="${VERSION_CODE}"

      - name: Prepare APK asset
        run: |
          set -e
          APK="$(ls app/build/outputs/apk/debug/*.apk | head -1)"
          OUT="LylyReader-v${VERSION_NAME}-debug.apk"
          cp "$APK" "$OUT"
          echo "APK_ASSET=$OUT" >> "$GITHUB_ENV"
          echo "Asset: $OUT (origem: $APK)"

      - name: Publish GitHub Release (cria a tag v<versão> no commit disparado)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          name: LylyReader ${{ env.VERSION_NAME }}
          files: ${{ env.APK_ASSET }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          # Versões com hífen (ex.: 1.6.1-beta.2) são pré-releases; 1.6.1 é release final.
          prerelease: ${{ contains(env.VERSION_NAME, '-') }}

      - name: Delete older releases (mantém as 3 mais recentes)
        # Roda só depois da nova release já estar publicada com sucesso (passo acima) — limpeza,
        # nunca crítico ao processo de release em si. As 3 mais recentes ficam como caminho de volta caso
        # uma versão saia com defeito; das mais antigas só a Release (card + APK) é removida, a tag fica.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOVA: v${{ env.VERSION_NAME }}
          MANTER: "3"
        run: |
          # gh release list vem da mais nova para a mais antiga; a recém-publicada sempre fica.
          n=0
          for tag in $(gh release list --limit 50 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[].tagName'); do
            if [ "$tag" = "$NOVA" ]; then continue; fi
            n=$((n + 1))
            if [ "$n" -ge "$MANTER" ]; then
              echo "Apagando release antiga: $tag (tag mantida)"
              gh release delete "$tag" --yes --cleanup-tag=false
            fi
          done
